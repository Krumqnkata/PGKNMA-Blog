<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ПГКНМА Блог</title>
    <meta name="description" content="Научете най-новите новини свързани с гимназията и интересни работи." />
    <meta name="author" content="ПГКНМА" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&display=swap" rel="stylesheet">

    <link rel="icon" id="favicon" href="favicon.ico"/>
    <meta property="og:title" content="ПГКНМА Блог" />
    <meta property="og:description" content="ПГКНМА Блог" />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="root"></div>

<script>
  const titles = [
    "ПГКНМА Блог",
    "📰 Виж последните новини",
    "🚀 Нови проекти се раждат",
    "💻 Кодът говори повече от думи",
    "👥 Това е твоето място",
    "🌍 Част от ИТ света",
    "🤔 Какво изпусна днес?"
  ];

  let index = 0;
  let interval = null;
  const favicon = document.getElementById('favicon');

  // Опресняване на favicon
  const refreshFavicon = () => {
    if (favicon) {
      favicon.href = `favicon.ico?v=${Date.now()}`;
    }
  };

  // Смяна на заглавията (по-плавно)
  const changeTitle = () => {
    index = (index + 1) % titles.length;
    document.title = titles[index];
  };

  const startTitleCycle = () => {
    if (interval) return; // защита от дублиране

    interval = setInterval(changeTitle, 3500);
  };

  const stopTitleCycle = () => {
    clearInterval(interval);
    interval = null;
  };

  // --- СТАРТ ---
  document.title = titles[0];
  refreshFavicon();
  startTitleCycle();

  // По-надеждно следене дали табът е активен
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      stopTitleCycle();

      // малко по-човешко послание
      document.title = "👀 Къде изчезна?";
    } else {
      // лек ефект при връщане
      document.title = "✨ Добре дошъл обратно!";
      
      setTimeout(() => {
        document.title = titles[index];
        startTitleCycle();
      }, 1500);

      refreshFavicon();
    }
  });
</script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
